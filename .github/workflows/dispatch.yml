name: dispatch
on:
  schedule: [{ cron: "*/30 * * * *" }]   # enabled 2026-09-06 after end-to-end verification
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = only print what would be posted"
        required: false
        default: "1"
concurrency: { group: repo-writes, cancel-in-progress: false }
jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      # ref: main = check out the newest main when the job actually starts (after the
      # repo-writes queue), not the SHA frozen when the run was created. Without it, two
      # runs created seconds apart (GitHub cron + Make ticker) both read the same old
      # state/posted.json and the second one re-posts the same pin (2026-10-20 15:30Z).
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Send due pins to Make
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_KEY: ${{ secrets.MAKE_WEBHOOK_KEY }}
          DRY_RUN: ${{ inputs.dry_run == '1' && '1' || '' }}
        run: node scripts/dispatch.js
      - name: Commit state
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add state
          git commit -m "state: dispatch $(date -u +%FT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase
          git push
