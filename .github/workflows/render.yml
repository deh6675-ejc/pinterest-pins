name: render
on:
  push:
    paths: ["pins/*.json", "hero/**", "scripts/render.js"]
  workflow_dispatch:
    inputs:
      date:
        description: "Plan date YYYY-MM-DD (blank = newest)"
        required: false
        default: ""
concurrency: { group: repo-writes, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Compose pins
        run: node scripts/render.js ${{ inputs.date }}
      - name: Commit outputs
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add outputs
          git commit -m "render: pin images" || echo "nothing to commit"
          git pull --rebase
          git push
